name: PaiVoice App integration typecheck

on:
  push:
    branches:
      - feature/paivoice-realtime-call
    paths:
      - ".github/workflows/paivoice-app-typecheck.yml"
      - "app/api/paivoice/**"
      - "components/chat/paivoice-call-screen.tsx"
      - "components/chat/call-layer.tsx"
      - "components/chat/chat-room.tsx"
      - "components/desktop-shell.tsx"
      - "lib/call-session-store.ts"
      - "lib/paivoice/**"
      - ".env.example"
      - "tsconfig.json"
      - "package-lock.json"

jobs:
  typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: TypeScript check
        run: npx tsc --noEmit --incremental false
